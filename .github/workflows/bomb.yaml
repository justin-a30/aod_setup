name: bomb
on:
  push:
    branches: [ "hyper2" ]

  pull_request:
    branches: [ "hyper2" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build with Gradle
        run : |
            ./gradlew assembleRelease
            mkdir -p overlay
            cp sysui/build/outputs/apk/release/sysui-release-unsigned.apk overlay/MxGSystemUIOverlayHelper.apk
            cp framework/build/outputs/apk/release/framework-release-unsigned.apk overlay/MxGFrameworkOverlayHelper.apk
            cp chargebottle/build/outputs/apk/release/chargebottle-release-unsigned.apk overlay/MxGBottleAnimationOverlayHelper.apk
            cp chargeglow/build/outputs/apk/release/chargeglow-release-unsigned.apk overlay/MxGGlowAnimationOverlayHelper.apk
            cp chargeripple/build/outputs/apk/release/chargeripple-release-unsigned.apk overlay/MxGRippleAnimationOverlayHelper.apk
            cp extraoverlay/build/outputs/apk/release/extraoverlay-release-unsigned.apk overlay/MxGExtraOverlayHelper.apk

      - name: Get basic variables
        run: |
          file_getprop() { grep "^$2=" "$1" | cut -d= -f2-; }
          echo "version=$(grep '^versionCode=' module.prop | cut -d= -f2-)" >> $GITHUB_ENV
          echo "DATE=$(date +"%H%M-%d%m%Y")" >> $GITHUB_ENV

      - name: Ensure var (Verbose)
        env:
          version: ${{ env.version }}
          DATE: ${{ env.DATE }}
        run: echo "Version $version, DATE $DATE"

      # - name: Tar time
        # run: |
          # XZ_OPT=-9 tar cJf overlay.tar.xz overlay
          # XZ_OPT=-9 tar cJf apks.tar.xz apks

      - name: Tidy up
        run: |
          mkdir module
          rsync -av . module --exclude=module --exclude=.git --exclude=.github --exclude=chargeripple --exclude=chargebottle --exclude=chargeglow --exclude=extraoverlay --exclude=framework --exclude=sysui --exclude=gradle --exclude=build.gradle --exclude=build.sh --exclude=gradle.properties --exclude=gradlew --exclude=gradlew.bat --exclude=settings.gradle --exclude=overlay --exclude=apks --exclude=install.sh
          cp install.sh module/META-INF/com/google/android/magisk/customize.sh
          cp module.prop module/META-INF/com/google/android/magisk/module.prop

      - name: Zip time
        env:
          version: ${{ env.version }}
          DATE: ${{ env.DATE }}
        run: 7z a ModdedXGoodies-v"$version"-"$DATE".zip ./module/*  

      - name: Find module
        run: |
          echo "MODULE=$(find "$(pwd)" -name 'ModdedXGoodies*.zip')" >> $GITHUB_ENV
          echo "${{ env.MODULE }}"
              
      - name: Initialize TelegramBotAPI for file uploads
        env:
          API_ID: ${{ secrets.API_ID }}
          API_HASH: ${{ secrets.API_HASH }}
        run: |
          chmod +x .github/bin/telegram-bot-api
          ./.github/bin/telegram-bot-api --api-id=$API_ID --api-hash=$API_HASH &

      - name: upload to tg
        env:
          MODULE: ${{ env.MODULE }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
          COMMIT_URL: ${{ github.event.head_commit.url }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: python3 .github/scripts/tg.py
